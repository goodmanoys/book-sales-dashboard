<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e8f2fa"><title>내 책 순위 · 위젯</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#162d4e;background:#eaf3fa}*{box-sizing:border-box}body{margin:0;padding:9px}.w{background:linear-gradient(135deg,#fdfefe,#e8f2fa);border:1px solid #d5e4f0;border-radius:19px;padding:12px 15px;box-shadow:0 5px 18px #17406316;min-width:230px}.header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.title{font-size:12px;font-weight:850;letter-spacing:-.045em}.go{font-size:10px;color:#4e79a2;white-space:nowrap;text-decoration:none}.rows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.cell{border-right:1px solid #dce6ed;padding-right:7px}.cell:last-child{border-right:0;padding-right:0}.label{color:#728aa1;font-size:10px;letter-spacing:-.045em;white-space:nowrap}.value{font-size:clamp(20px,6vw,31px);font-weight:850;line-height:1.4;letter-spacing:-.06em;font-variant-numeric:tabular-nums}.unit{font-size:11px;font-weight:650;color:#788fa3;margin-left:2px}.foot{display:flex;justify-content:space-between;gap:8px;margin-top:9px;font-size:9px;color:#8094a7}.warn{color:#ad6268}@media(max-width:275px){.w{padding:10px}.label{font-size:9px}.value{font-size:20px}.unit{font-size:9px}}@media(prefers-color-scheme:dark){:root{color:#eaf3fd;background:#182c41}.w{background:linear-gradient(135deg,#1e354e,#253e56);border-color:#33506a}.label,.foot,.unit{color:#a9bbca}.cell{border-color:#3c5670}.go{color:#b5ddf8}}</style></head><body><section class="w" aria-label="도서 판매현황 간편 위젯"><header class="header"><span class="title">다가설 때와 멈출 때</span><a class="go" href="./index.html" target="_top">자세히 ↗</a></header><div class="rows"><div class="cell"><div class="label">교보 · 자기계발</div><div class="value"><span id="a">66</span><span class="unit">위</span></div></div><div class="cell"><div class="label">교보 · 종합</div><div class="value"><span id="b">760</span><span class="unit">위</span></div></div><div class="cell"><div class="label">YES24 지수</div><div class="value"><span id="c">5,190</span></div></div></div><footer class="foot"><span id="status">초기 기준값 · 자동 갱신 미연결</span><span id="checked">10.22 기준</span></footer></section><script>
const d=document,f=n=>Number.isFinite(n)?n.toLocaleString('ko-KR'):'—';async function load(){try{const r=await fetch('./data.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('not found');const j=await r.json(),m=j.metrics;d.getElementById('a').textContent=f(m.kyobo_category.value);d.getElementById('b').textContent=f(m.kyobo_overall.value);d.getElementById('c').textContent=f(m.yes24_sales.value);const latest=Math.max(...Object.values(m).filter(x=>!['screenshot','web'].includes(x.origin)).map(x=>Date.parse(x.checked_at)||0),0);const status=d.getElementById('status');status.className='';status.textContent=!j.run_at?'초기 기준값 · 자동 갱신 미연결':latest===0?'자동 확인 필요':Date.now()-latest>4*3600000?'데이터 갱신 지연':'자동 수집 연결됨';if(latest===0||(latest>0&&Date.now()-latest>4*3600000))status.className='warn';d.getElementById('checked').textContent=j.run_at?'마지막 시도 '+new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(j.run_at)):'10.22 기준'}catch(e){/* Offline fallback keeps honest baseline notice. */}}load();setInterval(load,60000)
</script></body></html>
